aid: stackyard

name: StackYard

description: StackYard (stackyard.ai) is a directory and marketplace for AI products, operated by Arty Fishall LLC, a Delaware limited liability company. It lets buyers compare models, agents, infrastructure and developer tools, read reviews tied to verified work emails, and lets AI vendors list products free with optional labeled paid placement. No public developer API, documentation or SDK is published; the site's front end calls an undocumented JSON backend at api.stackyard.ai.

